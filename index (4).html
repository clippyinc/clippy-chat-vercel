  <style>

    .pb-\[148px\] { padding-bottom: 148px; }

<body>
  <div id="root"></div>
  
  <script type="module">
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.3.1';
    import ReactDOM from 'https://esm.sh/react-dom@18.3.1/client';

    // Standalone component icon elements built using native vectors to prevent loading issues
    const ArrowUpIcon = () => React.createElement("svg", { width: 18, height: 18, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2.5, strokeLinecap: "round", strokeLinejoin: "round" }, React.createElement("path", { d: "m5 12 7-7 7 7" }), React.createElement("path", { d: "M12 19V5" }));
    const PlusIcon = () => React.createElement("svg", { width: 18, height: 18, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" }, React.createElement("path", { d: "M5 12h14" }), React.createElement("path", { d: "M12 5v14" }));
    const CrossIcon = () => React.createElement("svg", { width: 12, height: 12, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" }, React.createElement("path", { d: "M18 6 6 18" }), React.createElement("path", { d: "m6 6 12 12" }));

    const DB_STORAGE_KEY = "clippy_terminal_history";

    function ClippyTerminal() {
      const [messages, setMessages] = useState(() => {
        try {
          const cached = localStorage.getItem(DB_STORAGE_KEY);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (Array.isArray(parsed) && parsed.length) return parsed;
          }
        } catch {}
        return [{ role: "assistant", content: "Mabuhay, Gelo! Clippy at your service. Let me know what we are searching, saving, or tracking tonight, bro.", ts: Date.now() }];
      });

      const [textInput, setTextInput] = useState("");
      const [attachedFiles, setAttachedFiles] = useState([]);
      const [isProcessing, setIsProcessing] = useState(false);
      const [fileAlertActive, setFileAlertActive] = useState(false);

      const hiddenFileInput = useRef(null);
      const endOfFeedRef = useRef(null);
      const autoExpandingTextarea = useRef(null);

      useEffect(() => {
        localStorage.setItem(DB_STORAGE_KEY, JSON.stringify(messages));
      }, [messages]);

      useEffect(() => {
        endOfFeedRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, attachedFiles]);

      useEffect(() => {
        if (autoExpandingTextarea.current) {
          autoExpandingTextarea.current.style.height = "24px";
          autoExpandingTextarea.current.style.height = Math.min(autoExpandingTextarea.current.scrollHeight, 120) + "px";
        }
      }, [textInput]);

      const processFileSelection = (e) => {
        const fileList = e.target.files;
        if (!fileList) return;

        Array.from(fileList).forEach(file => {
          const filenameLower = file.name.toLowerCase();
          const validPdf = filenameLower.endsWith('.pdf');
          const validCsv = filenameLower.endsWith('.csv');

          if (!validPdf && !validCsv) {
            alert("Only PDF and CSV files are allowed for Mark 1 layout processing, manager.");
            return;
          }

          const fileReader = new FileReader();
          fileReader.onload = () => {
            const fileStringContent = String(fileReader.result || "");
            setAttachedFiles(prev => {
              if (prev.length >= 3) return prev;
              return [...prev, { name: file.name, ext: validPdf ? "PDF" : "CSV", content: fileStringContent.slice(0, 4000) }];
            });
          };
          fileReader.readAsText(file);
        });

        if (hiddenFileInput.current) hiddenFileInput.current.value = "";
      };

      const dispatchPayloadToBackend = async () => {
        const cleanMsg = textInput.trim();
        if ((!cleanMsg && attachedFiles.length === 0) || isProcessing) return;

        // Collect content parameters across the local session storage lines
        const dynamicDocumentContext = attachedFiles.map(f => `[FILE PARSED: ${f.name}]\n\${f.content.slice(0, 1000)}`).join("\n\n");
        const compositeQueryString = cleanMsg + (dynamicDocumentContext ? `\n\n\${dynamicDocumentContext}` : "");

        const localUserLogBlock = { 
          role: "user", 
          content: cleanMsg || `Attached Docs: \${attachedFiles.map(f => f.name).join(", ")}`, 
          ts: Date.now() 
        };

        setMessages(prev => [...prev, localUserLogBlock]);
        setTextInput("");
        setAttachedFiles([]);
        setIsProcessing(true);

        try {
          // Direct communication tunnel targeting our serverless endpoint module location
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: compositeQueryString,
              messages: messages.slice(-6).map(m => ({ role: m.role, content: m.content }))
            })
          });

          const dataResponse = await response.json();
          setMessages(prev => [...prev, { role: "assistant", content: dataResponse.reply || "Server function execution fault parameter missing.", ts: Date.now() }]);
        } catch (error) {
          setMessages(prev => [...prev, { role: "assistant", content: `Route Connection Error: \${error.message}`, ts: Date.now() }]);
        } finally {
          setIsProcessing(false);
        }
      };

      const formControlValidFlags = textInput.trim().length > 0 || attachedFiles.length > 0;

      return React.createElement("div", { className: "min-h-screen bg-[#0a0a0a] text-white flex flex-col selection:bg-white selection:text-black" },
        // Top Fixed Panel Container Header Row
        React.createElement("header", { className: "fixed top-0 left-0 right-0 h-[56px] bg-[#0a0a0a] border-b border-[#212121] flex items-center justify-center z-50" },
          React.createElement("button", { className: "font-mono font-bold text-[18px] tracking-[2px] text-white" }, "CLIPPY")
        ),

        // System target input file elements
        React.createElement("input", { ref: hiddenFileInput, type: "file", accept: ".pdf,.csv", multiple: true, className: "hidden", onChange: processFileSelection }),

        // Core Message History Feed Panel Window
        React.createElement("main", { className: "flex-1 w-full pt-[56px] pb-[148px]" },
          React.createElement("div", { className: "w-full max-w-[680px] mx-auto px-4 pt-8 flex flex-col gap-4" },
            messages.map((m, idx) => 
              React.createElement("div", { key: idx, className: `flex \${m.role === 'user' ? 'justify-end' : 'justify-start'}` },
                React.createElement("div", { className: `max-w-[85%] rounded-[16px] px-4 py-3 text-[15px] leading-[1.6] whitespace-pre-wrap break-words \${m.role === 'user' ? 'bg-[#2a2a2a] text-white' : 'bg-[#171717] text-neutral-200'}` }, m.content)
              )
            ),
            React.createElement("div", { ref: endOfFeedRef })
          )
        ),

        // Fixed Control Console Layout Dock at the bottom
        React.createElement("div", { className: "fixed bottom-0 left-0 right-0 bg-[#0a0a0a] border-t border-[#171717] z-40" },
          React.createElement("div", { className: "w-full max-w-[680px] mx-auto px-3 py-3" },
            fileAlertActive && React.createElement("div", { className: "mb-2 px-3 py-2 bg-[#171717] border border-[#2a2a2a] rounded-full text-[11px] text-neutral-400 w-fit" }, "Select PDF or CSV — Mark 1 clean text focus"),
            
            // Layout chip arrays visualizing pending uploaded file assets
            attachedFiles.length > 0 && React.createElement("div", { className: "flex flex-wrap gap-2 mb-3 px-1" },
              attachedFiles.map((file, fIdx) => 
                React.createElement("div", { key: fIdx, className: "flex items-center gap-2 bg-[#1a1a1a] border border-[#2a2a2a] rounded-full pl-1 pr-2 py-1" },
                  React.createElement("span", { className: "bg-[#2a2a2a] text-[10px] font-mono font-bold tracking-wider text-neutral-300 px-2 py-1 rounded-full" }, file.ext),
                  React.createElement("span", { className: "text-[12px] text-neutral-300 max-w-[160px] truncate" }, file.name),
                  React.createElement("button", { 
                    onClick: () => setAttachedFiles(prev => prev.filter((_, targetIdx) => targetIdx !== fIdx)),
                    className: "w-5 h-5 rounded-full bg-[#2a2a2a] hover:bg-[#333] flex items-center justify-center transition-colors" 
                  }, React.createElement(CrossIcon, null))
                )
              )
            ),

            // Execution Input Row Container
            React.createElement("div", { className: "flex items-end gap-2 bg-[#212121] rounded-[28px] p-2 border border-transparent focus-within:border-[#2a2a2a] transition-colors" },
              React.createElement("button", { 
                onClick: () => { setFileAlertActive(true); setTimeout(() => setFileAlertActive(false), 2500); hiddenFileInput.current?.click(); },
                className: "w-9 h-9 min-w-9 min-h-9 rounded-full bg-[#1a1a1a] border border-[#2a2a2a] flex items-center justify-center hover:bg-[#222] transition-colors shrink-0"
              }, React.createElement(PlusIcon, null)),
              
              React.createElement("textarea", { 
                ref: autoExpandingTextarea,
                value: textInput,
                onChange: (e) => setTextInput(e.target.value),
                onKeyDown: (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); dispatchPayloadToBackend(); } },
                placeholder: "Ask Clippy or route keys (!search, !save, !fetch)...",
                rows: 1,
                className: "flex-1 bg-transparent outline-none resize-none text-[15px] leading-6 text-white placeholder:text-neutral-500 py-[6px] max-h-[120px] min-h-[24px]"
              }),
              
              React.createElement("button", { 
                onClick: dispatchPayloadToBackend,
                disabled: !formControlValidFlags || isProcessing,
                className: `w-9 h-9 min-w-9 min-h-9 rounded-full flex items-center justify-center transition-all shrink-0 \${formControlValidFlags ? 'bg-white text-black hover:bg-neutral-200' : 'bg-[#3a3a3a] text-neutral-500'}`
              }, React.createElement(ArrowUpIcon, null))
            ),
            
            React.createElement("div", { className: "text-[11px] text-neutral-600 text-center mt-2.5 font-mono" }, "PDF • CSV only — Mark 1 clean text focus")
          )
        )
      );
    }

    const domContainerRootNode = ReactDOM.createRoot(document.getElementById("root"));
    domContainerRootNode.render(React.createElement(React.StrictMode, null, React.createElement(ClippyTerminal, null)));
  </script>
</body>
